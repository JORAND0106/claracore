name: Azure Static Web Apps CI/CD

# Staging: los previews de PR están desactivados temporalmente porque Azure
# reporta "maximum number of staging environments" y los entornos huérfanos no
# se pueden borrar con el SP actual (AZURE_CREDENTIALS no ve el SWA).
# Production (push a main) sigue activo. Tras limpiar staging en Portal o
# conceder Contributor del SP al RG del SWA, restaurar el if de build_and_deploy_job:
#   if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # Solo production hasta liberar cupo de staging en Azure.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GRASS_0AEA5F31E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "frontend" # App source code path
          api_location: "frontend/api" # Proxy App Insights (panel diagnóstico; no es el backend FastAPI)
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_DEVELOPER_PANEL_KEY: ${{ secrets.VITE_DEVELOPER_PANEL_KEY }}
          VITE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.VITE_APPLICATIONINSIGHTS_CONNECTION_STRING }}
          VITE_APPINSIGHTS_API_KEY: ${{ secrets.VITE_APPINSIGHTS_API_KEY }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GRASS_0AEA5F31E }}
          action: "close"
