# Gate Programación Silvania: bloquea si mapa/tramos/presupuesto/ejecutado regresan.
name: QA prog obra smoke Silvania

on:
  workflow_dispatch:
    inputs:
      contrato_id:
        description: "contrato_id (default Silvania=3)"
        required: false
        default: "3"
  push:
    branches: [main]
    paths:
      - "backend/prog_obra_*.py"
      - "backend/listado_agrupador_membership.py"
      - "backend/prog_obra_routes.py"
      - "backend/prog_obra_costos_presupuesto.py"
      - "backend/scripts/qa_prog_obra_smoke_silvania.py"
      - ".github/workflows/qa-prog-obra-smoke-silvania.yml"
  pull_request:
    paths:
      - "backend/prog_obra_*.py"
      - "backend/listado_agrupador_membership.py"
      - "backend/prog_obra_routes.py"
      - "backend/prog_obra_costos_presupuesto.py"
      - "backend/scripts/qa_prog_obra_smoke_silvania.py"
      - ".github/workflows/qa-prog-obra-smoke-silvania.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Healthz producción
        run: |
          curl -sS "https://claracore-backend.azurewebsites.net/healthz" | tee /tmp/healthz.json
          python3 -c "import json; d=json.load(open('/tmp/healthz.json')); print('git_sha', d.get('git_sha'))"
      - name: Install deps
        run: |
          python -m pip install -q azure-identity azure-mgmt-web PyJWT
          python -m pip install -q -r backend/requirements.txt
      - name: Smoke Programación Silvania
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          QA_CONTRATO_ID: ${{ github.event.inputs.contrato_id || '3' }}
          QA_HTTP: "1"
        working-directory: ./backend
        run: |
          set -e
          if [ -z "${AZURE_CREDENTIALS}" ]; then
            echo "AZURE_CREDENTIALS ausente" >&2
            exit 1
          fi
          PYTHONPATH=. python3 scripts/qa_prog_obra_smoke_silvania.py
