# Despliega SOLO la carpeta backend al App Service Linux (claracore-backend).
# Reemplaza azure-backend-app-service.yml (quedó disabled_manually y dejó prod sin Seguimiento).
# Requisitos: secreto AZURE_WEBAPP_PUBLISH_PROFILE + Startup Command sin "cd backend":
#   python -m uvicorn main:app --host 0.0.0.0 --port $PORT
name: Deploy backend on push

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-on-push.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: claracore-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend
