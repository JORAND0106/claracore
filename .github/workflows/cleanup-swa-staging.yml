# Lista y elimina entornos de staging huérfanos de Azure Static Web Apps.
# Mantiene production. Úsalo cuando los deploys de PR fallen con:
#   "This Static Web App already has the maximum number of staging environments"
#
# Secrets: AZURE_CREDENTIALS (mismo JSON de service principal que deploy-backend.yml)
#
# Trigger: workflow_dispatch, o push de este archivo a main.

name: Cleanup SWA staging environments

on:
  # También en push de este archivo a main (el token de integración no puede
  # hacer workflow_dispatch; así el merge dispara la limpieza una vez).
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-swa-staging.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Si es true, solo lista entornos sin borrar'
        required: false
        type: boolean
        default: false
      keep_environment_names:
        description: 'Nombres extra a conservar (comma-separated), además de default/production'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cleanup-swa-staging
  cancel-in-progress: false

jobs:
  cleanup:
    name: List and delete staging environments
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      SWA_NAME: happy-grass-0aea5f31e
      SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GRASS_0AEA5F31E }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve Static Web App from deploy token + ARM
        id: resolve
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, json, os, subprocess, sys

          def run(cmd, check=True):
              print("+", " ".join(cmd), flush=True)
              p = subprocess.run(cmd, text=True, capture_output=True)
              if check and p.returncode != 0:
                  print(p.stdout)
                  print(p.stderr, file=sys.stderr)
                  raise subprocess.CalledProcessError(p.returncode, cmd, p.stdout, p.stderr)
              return p.stdout

          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")

          # 1) Decificar claims del deployment token (sin imprimir el secreto)
          token = os.environ.get("SWA_DEPLOY_TOKEN") or ""
          resource_id = ""
          # No imprimir valores de claims (GitHub puede redactar la línea entera
          # si algún valor coincide con el secreto). Solo metadatos + ResourceId.
          print(
              f"deploy_token: present={bool(token)} len={len(token)} "
              f"dot_count={token.count('.')}",
              flush=True,
          )
          summary.write(
              f"## Deployment token\npresent={bool(token)} len={len(token)} "
              f"dots={token.count('.')}\n"
          )
          if token.count(".") >= 2:
              payload = token.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              try:
                  claims = json.loads(base64.urlsafe_b64decode(payload.encode("ascii")))
              except Exception as e:
                  claims = {"_decode_error": str(e)}
              keys = sorted(claims.keys())
              print(f"token claim keys: {keys}", flush=True)
              summary.write(f"claim keys: `{keys}`\n")
              resource_id = (
                  claims.get("ResourceId")
                  or claims.get("resourceId")
                  or claims.get("stable_resource_id")
                  or ""
              )
              # ResourceId es una ruta ARM, no el secreto; seguro de mostrar.
              if resource_id:
                  print(f"ResourceId from token: {resource_id}", flush=True)
                  summary.write(f"ResourceId: `{resource_id}`\n")
              else:
                  print("ResourceId claim missing in token", flush=True)
          else:
              summary.write("Token ausente o no es JWT (sin dots).\n")

          # 2) Suscripciones / RGs visibles para el SP (diagnóstico)
          summary.write("\n## Suscripciones del service principal\n```\n")
          summary.write(run(["az", "account", "list", "-o", "table"], check=False) or "(vacío)\n")
          summary.write("```\n")
          summary.write("\n## Resource groups visibles\n```\n")
          summary.write(run(["az", "group", "list", "-o", "table"], check=False) or "(vacío)\n")
          summary.write("```\n")

          apps = []
          for sub in json.loads(run(["az", "account", "list", "--query", "[].id", "-o", "json"])):
              try:
                  run(["az", "account", "set", "--subscription", sub])
                  partial = json.loads(run(["az", "staticwebapp", "list", "-o", "json"]))
                  if isinstance(partial, list):
                      apps.extend(partial)
              except subprocess.CalledProcessError as e:
                  print(f"skip sub {sub}: {e}", flush=True)

          summary.write("\n## Static Web Apps visibles al SP\n```json\n")
          summary.write(json.dumps([
              {
                  "name": a.get("name"),
                  "resourceGroup": a.get("resourceGroup"),
                  "defaultHostname": a.get("defaultHostname"),
                  "id": a.get("id"),
              }
              for a in apps
          ], indent=2))
          summary.write("\n```\n")

          name = os.environ["SWA_NAME"]
          rg = ""
          sub = ""

          if resource_id:
              parts = resource_id.strip("/").split("/")
              # subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Web/staticSites/{name}
              try:
                  sub = parts[parts.index("subscriptions") + 1]
                  rg = parts[parts.index("resourceGroups") + 1]
                  name = parts[parts.index("staticSites") + 1]
              except (ValueError, IndexError):
                  print(f"Could not parse ResourceId: {resource_id}", flush=True)
              else:
                  print(f"From token ResourceId: sub={sub} rg={rg} name={name}", flush=True)
                  summary.write(f"\nResourceId del token: `{resource_id}`\n")
                  run(["az", "account", "set", "--subscription", sub], check=False)

          if not rg:
              target = os.environ["SWA_NAME"].lower()
              matches = [
                  a for a in apps
                  if (a.get("name") or "").lower() == target
                  or target in (a.get("name") or "").lower()
                  or "happy-grass" in (a.get("defaultHostname") or "").lower()
              ]
              if matches:
                  app = matches[0]
                  rg = app.get("resourceGroup") or ""
                  name = app.get("name") or name
                  rid = app.get("id") or ""
                  parts = rid.split("/")
                  if "subscriptions" in parts:
                      sub = parts[parts.index("subscriptions") + 1]
                      run(["az", "account", "set", "--subscription", sub])

          if not rg:
              msg = (
                  "No se pudo resolver el resource group del Static Web App. "
                  "El service principal de AZURE_CREDENTIALS no ve happy-grass-0aea5f31e. "
                  "Concede al SP rol Contributor (o Static Web App Contributor) sobre el "
                  "resource group del SWA, o ejecuta localmente: "
                  "az staticwebapp environment list --name happy-grass-0aea5f31e -g <RG>"
              )
              print(msg, flush=True)
              summary.write(f"\n### Bloqueo\n{msg}\n")
              summary.close()
              sys.exit(1)

          # Probar acceso ARM
          show = subprocess.run(
              ["az", "staticwebapp", "show", "--name", name, "--resource-group", rg, "-o", "json"],
              text=True, capture_output=True,
          )
          summary.write("\n## az staticwebapp show\n```\n")
          summary.write(show.stdout or show.stderr or "(sin salida)\n")
          summary.write("```\n")
          if show.returncode != 0:
              msg = (
                  f"El SP no tiene permiso ARM sobre {name} en rg={rg} (sub={sub or '?'}). "
                  "En Azure Portal: Access control (IAM) del resource group del SWA → "
                  "Add role assignment → Contributor → el service principal de AZURE_CREDENTIALS."
              )
              print(msg, flush=True)
              print(show.stderr, flush=True)
              summary.write(f"\n### Bloqueo de permisos\n{msg}\n")
              summary.close()
              sys.exit(1)

          print(f"Resolved SWA name={name} rg={rg} sub={sub}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
              envf.write(f"SWA_NAME={name}\n")
              envf.write(f"SWA_RG={rg}\n")
              if sub:
                  envf.write(f"SWA_SUB={sub}\n")
          summary.write(f"\nResolved: **{name}** in `{rg}` (sub `{sub}`)\n")
          summary.close()
          PY

      - name: List Static Web App environments
        id: list
        run: |
          set -euo pipefail
          if [ -n "${SWA_SUB:-}" ]; then
            az account set --subscription "$SWA_SUB"
          fi
          echo "## Entornos actuales de \`$SWA_NAME\` (rg=\`$SWA_RG\`)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          az staticwebapp environment list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RG" \
            -o json | tee /tmp/swa-envs.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Delete non-production staging environments
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP_EXTRA: ${{ inputs.keep_environment_names }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, subprocess, sys

          dry = os.environ.get("DRY_RUN", "false").lower() in ("1", "true", "yes")
          keep_extra = {
              x.strip().lower()
              for x in os.environ.get("KEEP_EXTRA", "").split(",")
              if x.strip()
          }
          # Azure usa "default" para production en builds de SWA
          keep = {"default", "production"} | keep_extra

          with open("/tmp/swa-envs.json", encoding="utf-8") as f:
              envs = json.load(f)

          if not isinstance(envs, list):
              print("Unexpected list payload:", type(envs), envs)
              sys.exit(1)

          print(f"Found {len(envs)} environment(s). Keep set: {sorted(keep)}")
          deleted = []
          kept = []
          for env in envs:
              name = (
                  env.get("name")
                  or env.get("buildId")
                  or env.get("environmentName")
                  or ""
              )
              hostname = env.get("hostname") or env.get("defaultHostname") or ""
              status = env.get("status") or env.get("buildStatus") or ""
              key = str(name).strip().lower()
              print(f"- name={name!r} hostname={hostname!r} status={status!r}")
              if key in keep:
                  kept.append(name)
                  print(f"  KEEP {name}")
                  continue
              if dry:
                  print(f"  DRY-RUN would delete {name}")
                  deleted.append(name)
                  continue
              cmd = [
                  "az", "staticwebapp", "environment", "delete",
                  "--name", os.environ["SWA_NAME"],
                  "--resource-group", os.environ["SWA_RG"],
                  "--environment-name", str(name),
                  "--yes",
              ]
              print(f"  DELETE {name} ...")
              subprocess.check_call(cmd)
              deleted.append(name)

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as s:
              s.write("\n## Resultado\n")
              s.write(f"- Dry run: `{dry}`\n")
              s.write(f"- Conservados: {kept or ['(ninguno aparte de filtro)']}\n")
              s.write(f"- Eliminados / a eliminar: {deleted or ['(ninguno)']}\n")

          print("Kept:", kept)
          print("Deleted:", deleted)
          PY

      - name: Re-list environments after cleanup
        if: always() && env.SWA_RG != ''
        run: |
          set -euo pipefail
          if [ -z "${SWA_RG:-}" ]; then
            echo "SWA_RG not set; skip re-list"
            exit 0
          fi
          echo "## Entornos tras la operación" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          az staticwebapp environment list \
            --name "$SWA_NAME" \
            --resource-group "$SWA_RG" \
            -o json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
