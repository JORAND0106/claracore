name: Probe ffmpeg on App Service
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe via Kudu
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          echo "$PUBLISH_PROFILE" > /tmp/pp.xml
          USER=$(python3 - <<'PY'
import re, pathlib
t=pathlib.Path('/tmp/pp.xml').read_text()
print(re.search(r'userName="([^"]+)"', t).group(1))
PY
)
          PASS=$(python3 - <<'PY'
import re, pathlib
t=pathlib.Path('/tmp/pp.xml').read_text()
print(re.search(r'userPWD="([^"]+)"', t).group(1))
PY
)
          echo "=== which ffmpeg / ffprobe ==="
          curl -sS -u "$USER:$PASS" -H 'Content-Type: application/json' \
            -d '{"command":"bash -lc \"command -v ffmpeg; command -v ffprobe; ls -la /usr/bin/ffmpeg /usr/bin/ffprobe 2>&1; uname -a; cat /etc/os-release | head -5\"","dir":"/home/site/wwwroot"}' \
            "https://claracore-backend.scm.azurewebsites.net/api/command" | tee /tmp/kudu_out.json
          echo
          echo "=== recent log lines mapa/ffmpeg ==="
          curl -sS -u "$USER:$PASS" -H 'Content-Type: application/json' \
            -d '{"command":"bash -lc \"rg -n -i \\\"mapa procesar video|ffmpeg|ffprobe\\\" /home/LogFiles 2>/dev/null | tail -40 || grep -Rni -e \\\"mapa procesar video\\\" -e ffmpeg /home/LogFiles 2>/dev/null | tail -40\"","dir":"/home"}' \
            "https://claracore-backend.scm.azurewebsites.net/api/command" | tee /tmp/kudu_logs.json
